# ============================================================
# HashCortx — Release Pipeline (Linux)
#
# TRIGGER:
#   - Push git tag: git tag v2.6.1 && git push origin v2.6.1
#   - Dipanggil oleh sync.yml (workflow_call) saat ada rilis tag baru di upstream
#   - Manual:       GitHub UI → tab Actions → Release → Run workflow
#
# OUTPUT:
#   GitHub Release (draft) berisi:
#     • hashcortx_<version>_amd64.deb       → install di Debian/Ubuntu
#     • hashcortx_<version>_amd64.AppImage  → portable, tanpa install
#
# INSTALL hasil .deb:
#   sudo apt install ./hashcortx_*.deb
#
# CATATAN UBUNTU VERSION:
#   Harus ubuntu-24.04 (bukan 22.04). Dependency `ort` (ONNX Runtime
#   untuk local embeddings) butuh glibc 2.38+ dan libstdc++ 13+.
#   Ubuntu 22.04 hanya punya glibc 2.35 → build gagal saat linking
#   dengan error "undefined symbol". Lihat Cargo.toml untuk detail.
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*'          # trigger: v2.6.0, v2.6.1, v3.0.0, dst.
  workflow_call:      # bisa dipanggil langsung oleh workflow sync.yml
    inputs:
      tag_name:
        description: 'Tag name to release'
        required: true
        type: string
  workflow_dispatch:  # trigger manual dari tab Actions GitHub
    inputs:
      tag_name:
        description: 'Tag name (misal v2.6.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref || inputs.tag_name }}
  cancel-in-progress: true

jobs:
  release-linux:
    name: Build Linux (.deb + .AppImage)
    runs-on: ubuntu-24.04    # WAJIB 24.04 — glibc 2.38+ untuk ort ONNX Runtime
    permissions:
      contents: write        # diperlukan untuk membuat GitHub Release

    steps:
      # ── 0. Tentukan Tag Release ──────────────────────────────
      - name: Determine release tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${github.ref_name}"
          else
            TAG="v2.6.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # ── 1. Ambil source code ─────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ steps.vars.outputs.tag || github.ref }}

      # ── 2. Node.js LTS ───────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm

      # ── 3. Rust stable ───────────────────────────────────────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # ── 4. Cache Rust artifacts (build berikutnya lebih cepat) ─
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── 5. System libraries Linux (wajib untuk Tauri v2) ─────
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl wget file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            patchelf

      # ── 6. Install JS dependencies (Tauri CLI + plugins) ─────
      - name: Install npm dependencies
        run: npm install

      # ── 7. Build & upload ke GitHub Release ──────────────────
      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: "HashCortx ${{ steps.vars.outputs.tag }}"
          releaseBody: |
            ## HashCortx ${{ steps.vars.outputs.tag }}

            ### Install di Linux (Debian/Ubuntu)

            Download file `.deb` di bawah lalu jalankan:
            ```bash
            sudo apt install ./hashcortx_*.deb
            ```

            Atau gunakan `.AppImage` (portable, tidak perlu install):
            ```bash
            chmod +x hashcortx_*.AppImage
            ./hashcortx_*.AppImage
            ```

            ### Catatan CPU
            Build default menggunakan local embeddings (semantic search)
            yang membutuhkan CPU dengan AVX2 (Intel Haswell 2013+ / AMD Excavator 2015+).
            Jika app tidak muncul setelah diklik, CPU kamu mungkin tidak support AVX2.

            ---
            Lihat [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            untuk detail perubahan versi ini.
          releaseDraft: true     # jadi draft dulu — publish manual setelah dicek
          prerelease: false
