# ============================================================
# HashCortx — Multi-Platform Release Pipeline
#
# PLATFORMS:
#   • Linux x86_64:   .deb + .AppImage
#   • Windows x64:    .exe (portable, no-embeddings) + -setup.exe (NSIS) + .msi
#   • macOS Apple Silicon (aarch64): .dmg
#   • macOS Intel (x86_64):          .dmg
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag name to release'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (misal v2.6.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref || inputs.tag_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x64
            platform: linux

          - os: windows-latest
            label: Windows x64
            platform: windows

          - os: macos-latest
            label: macOS Apple Silicon (aarch64)
            platform: macos-arm
            target: aarch64-apple-darwin

          - os: macos-13
            label: macOS Intel (x86_64)
            platform: macos-intel
            target: x86_64-apple-darwin

    steps:
      - name: Determine tag
        id: vars
        shell: bash
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${github.ref_name}"
          else
            TAG="v2.6.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          CLEAN_VER="${TAG#v}"
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ steps.vars.outputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - name: Install npm dependencies
        run: npm install

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: npm run tauri build

      - name: Build Windows Portable (no-embeddings)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --no-default-features
          mkdir -p dist-artifacts
          cp src-tauri/target/release/hashcortx.exe dist-artifacts/HashCortx_${{ steps.vars.outputs.version }}_x64_no-embeddings.exe

      - name: Build Windows Installer (NSIS)
        if: matrix.platform == 'windows'
        run: npm run tauri build

      - name: Build macOS (.dmg)
        if: startsWith(matrix.platform, 'macos')
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir -p staged-artifacts
          if [ "${{ matrix.platform }}" = "linux" ]; then
            cp src-tauri/target/release/bundle/deb/*.deb staged-artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage staged-artifacts/ 2>/dev/null || true
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            cp dist-artifacts/*.exe staged-artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/nsis/*.exe staged-artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/msi/*.msi staged-artifacts/ 2>/dev/null || true
          elif [ "${{ matrix.platform }}" = "macos-arm" ]; then
            cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg staged-artifacts/ 2>/dev/null || true
          elif [ "${{ matrix.platform }}" = "macos-intel" ]; then
            cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg staged-artifacts/ 2>/dev/null || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: staged-artifacts/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Determine tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${github.ref_name}"
          else
            TAG="v2.6.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          CLEAN_VER="${TAG#v}"
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Checkout repository for templates
        uses: actions/checkout@v4.2.2

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Calculate Checksums and Populate Release Body
        run: |
          cd all-artifacts
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

          get_hash() {
            grep -m 1 "$1" SHA256SUMS.txt | awk '{print $1}' || echo "N/A"
          }

          DEB_HASH=$(get_hash "\.deb$")
          APPIMAGE_HASH=$(get_hash "\.AppImage$")
          WIN_PORTABLE_HASH=$(get_hash "_no-embeddings\.exe$")
          WIN_SETUP_HASH=$(get_hash "-setup\.exe$")
          MAC_ARM_HASH=$(get_hash "aarch64.*\.dmg$\|aarch64\.dmg$")
          MAC_INTEL_HASH=$(get_hash "x64.*\.dmg$\|x86_64.*\.dmg$\|x64\.dmg$")

          cd ..
          cp .github/release-template.md release_notes.md

          sed -i "s|REPO_PLACEHOLDER|${{ github.repository }}|g" release_notes.md
          sed -i "s|VERSION_PLACEHOLDER|${{ steps.vars.outputs.version }}|g" release_notes.md
          sed -i "s|__DEB_HASH__|$DEB_HASH|g" release_notes.md
          sed -i "s|__APPIMAGE_HASH__|$APPIMAGE_HASH|g" release_notes.md
          sed -i "s|__WIN_PORTABLE_HASH__|$WIN_PORTABLE_HASH|g" release_notes.md
          sed -i "s|__WIN_SETUP_HASH__|$WIN_SETUP_HASH|g" release_notes.md
          sed -i "s|__MAC_ARM_HASH__|$MAC_ARM_HASH|g" release_notes.md
          sed -i "s|__MAC_INTEL_HASH__|$MAC_INTEL_HASH|g" release_notes.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "HashCortx ${{ steps.vars.outputs.tag }}"
          draft: true
          prerelease: false
          body_path: release_notes.md
          files: all-artifacts/*
